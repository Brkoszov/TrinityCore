name: Windows Build

on:
  workflow_dispatch:

env:
  VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
  VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg_cache

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache vcpkg binaries
      uses: actions/cache@v4
      with:
        path: C:\vcpkg_cache
        key: vcpkg-boost-openssl-${{ runner.os }}-v1

    - name: Install dependencies via vcpkg
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
        vcpkg install `
          boost-system boost-filesystem boost-program-options boost-iostreams `
          boost-regex boost-thread boost-chrono boost-locale boost-date-time `
          boost-asio boost-beast boost-container boost-property-tree `
          boost-multi-index boost-heap boost-stacktrace boost-variant `
          openssl `
          --triplet x64-windows-static-md

    - name: Configure CMake
      shell: cmd
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DTOOLS=ON ^
          -DSCRIPTS=dynamic ^
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake ^
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md ^
          -DMYSQL_ROOT_DIR="C:/Program Files/MySQL/MySQL Server 8.4"

    - name: Build Solution
      shell: cmd
      run: |
        cmake --build build --config Release --parallel 4

    - name: Copy MySQL runtime DLL
      shell: powershell
      run: |
        Copy-Item "C:\Program Files\MySQL\MySQL Server 8.4\lib\libmysql.dll" "build\bin\Release\" -ErrorAction SilentlyContinue

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: TrinityCore-Windows-Binaries
        path: build/bin/Release/
