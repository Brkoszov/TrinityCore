name: Windows Build

# Změna: Spouštění je povolené pouze ručně (workflow_dispatch)
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Configure CMake
      shell: cmd
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DTOOLS=ON -DSCRIPTS=dynamic -DWITH_WARNINGS_AS_ERRORS=ON

    - name: Build Solution
      shell: cmd
      run: |
        cmake --build build --config Release --parallel 4

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: TrinityCore-Windows-Binaries
        path: build/bin/Release/
