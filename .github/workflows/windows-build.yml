name: Windows Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    # Volitelné, ale jisté: Stažení a rozbalení Boostu, pokud ho dep/boost neobsahuje
    - name: Download and Setup Boost
      shell: powershell
      run: |
        $boostVersion = "1.84.0"
        $boostVersionUnderscore = $boostVersion -replace '\.', '_'
        $boostUrl = "https://sourceforge.net/projects/boost/files/boost/$boostVersion/boost_$boostVersionUnderscore.zip/download"
        
        Write-Host "Stahuji Boost $boostVersion..."
        Invoke-WebRequest -Uri $boostUrl -OutFile "boost.zip"
        
        Write-Host "Rozbaluji Boost..."
        Expand-Archive -Path "boost.zip" -DestinationPath "C:\boost"
        Move-Item "C:\boost\boost_$boostVersionUnderscore" "C:\boost\boost"

    - name: Configure CMake
      shell: cmd
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DTOOLS=ON -DSCRIPTS=dynamic -DWITH_WARNINGS_AS_ERRORS=ON -DBOOST_ROOT=C:/boost/boost

    - name: Build Solution
      shell: cmd
      run: |
        cmake --build build --config Release --parallel 4

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: TrinityCore-Windows-Binaries
        path: build/bin/Release/
