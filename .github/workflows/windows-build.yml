name: Windows Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-windows:
    runs-on: windows-2022 # Odpovídá Windows prostředí na AppVeyoru

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    # 1. Krok: Vytvoření buildovacího adresáře a konfigurace přes CMake
    # Upravte parametry -D podle toho, jaké závislosti (Boost, OpenSSL) máte uložené či dostupné
    - name: Configure CMake
      shell: cmd
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DTOOLS=ON -DSCRIPTS=dynamic -DWITH_WARNINGS_AS_ERRORS=ON

    # 2. Krok: Samotná kompilace projektu
    - name: Build Solution
      shell: cmd
      run: |
        cmake --build build --config Release --parallel 4

    # 3. Krok (Volitelně): Nahrání výsledných binárek jako artefaktu
    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: TrinityCore-Windows-Binaries
        path: build/bin/Release/
