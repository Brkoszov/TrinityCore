name: Windows Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    # Spolehlivé stažení Boostu z oficiálního GitHub zrcadla namísto SourceForge
    - name: Download and Setup Boost
      shell: powershell
      run: |
        $boostVersion = "1.84.0"
        $boostVersionUnderscore = $boostVersion -replace '\.', '_'
        $url = "https://github.com/boostorg/boost/releases/download/boost-$boostVersion/boost-$boostVersion.tar.gz"
        
        Write-Host "Stahuji Boost $boostVersion z GitHubu..."
        Invoke-WebRequest -Uri "https://archives.boost.io/release/$boostVersion/source/boost_$boostVersionUnderscore.zip" -OutFile "boost.zip"
        
        Write-Host "Ověřuji velikost souboru..."
        $fileSize = (Get-Item "boost.zip").Length
        if ($fileSize -lt 1000000) {
            Write-Error "Stažený soubor je příliš malý, pravděpodobně jde o chybu stahování."
            exit 1
        }
        
        Write-Host "Rozbaluji Boost (může to chvíli trvat)..."
        # Použití .NET třídy pro rozbalení, která je odolnější vůči chybám v modulu Archive
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        [System.IO.Compression.ZipFile]::ExtractToDirectory("$PWD\boost.zip", "C:\boost")
        Rename-Item "C:\boost\boost_$boostVersionUnderscore" "C:\boost\boost"

    - name: Configure CMake
      shell: cmd
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DTOOLS=ON -DSCRIPTS=dynamic -DWITH_WARNINGS_AS_ERRORS=ON -DBOOST_ROOT=C:/boost/boost

    - name: Build Solution
      shell: cmd
      run: |
        cmake --build build --config Release --parallel 4

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: TrinityCore-Windows-Binaries
        path: build/bin/Release/
